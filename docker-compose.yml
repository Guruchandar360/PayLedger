services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: payledger
      POSTGRES_USER: payledger
      POSTGRES_PASSWORD: payledger-local
    ports:
      - "127.0.0.1:55436:5432"
    volumes:
      - payledger-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U payledger -d payledger"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  payledger-data:
